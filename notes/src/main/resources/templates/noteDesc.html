<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Note Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/note.css" rel="stylesheet">
</head>
<body>
<div class="edit-card">
    <h2 th:text="${note.title}" class="mb-3"></h2>
    <p th:text="${note.content}" class="mb-3"></p>
    <span th:if="${note.completed}" class="completed-badge">Completed</span>
    <div class="mt-4">
        <a th:href="@{/api/notes}" class="btn btn-cancel">Back to Notes</a>
        <a th:href="@{/api/notes/{id}/edit(id=${note.id})}" class="btn btn-edit">Edit</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
