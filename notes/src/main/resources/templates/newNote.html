<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>New Note</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/note.css}" rel="stylesheet">
</head>
<body>
<div class="new-card">
    <h2 class="mb-4 text-center">Create a New Note</h2>
    <form th:action="@{/notes/create}" th:object="${note}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" th:field="*{title}" placeholder="Enter title..." required>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">Content</label>
            <textarea class="form-control" id="content" th:field="*{content}" rows="5" placeholder="Enter your note..." required></textarea>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="completed" th:field="*{completed}">
            <label class="form-check-label" for="completed">Completed</label>
        </div>
        <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-update btn-lg">Create</button>
            <a th:href="@{/notes}" class="btn btn-cancel btn-lg">Cancel</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
