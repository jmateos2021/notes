<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/note.css}" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="new-card mt-5">
        <h2 class="text-center mb-4">Log in</h2>

        <div th:if="${param.error}" class="alert alert-danger text-center py-2">Incorrect username or password.</div>
        <div th:if="${param.logout}" class="alert alert-info text-center py-2">You've logged out successfully.</div>
        <div th:if="${param.registered}" class="alert alert-success text-center py-2">Registration successful. Please log in.</div>

        <form th:action="@{/login}" method="post" class="d-flex flex-column gap-3">
            <input type="text" name="username" class="form-control" maxlength="50" placeholder="Username" required>
            <input type="password" name="password" class="form-control" placeholder="Password" required>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <button type="submit" class="btn btn-update w-100 mt-2">Log in</button>
        </form>

        <p class="text-center mt-3 mb-0">Don't have an account yet?
            <a th:href="@{/register}" class="text-success fw-semibold">Register here</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
