<!-- src/main/resources/templates/login.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Login</title></head>
<body>
<h1>Log in</h1>

<div th:if="${param.error}">Incorrect user or password</div>
<div th:if="${param.logout}">You've logged out</div>
<div th:if="${param.registered}">Success registration. Log in.</div>

<form th:action="@{/login}" method="post">
    <input type="text" name="username" placeholder="User" required />
    <input type="password" name="password" placeholder="Password" required />
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <button type="submit">Enter</button>
</form>

<p>Don't have an account yet? <a th:href="@{/register}">Register</a></p>
</body>
</html>
