<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/note.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="new-card mt-5">
        <h2 class="text-center mb-4">Create your account</h2>

        <div th:if="${error}" class="alert alert-danger text-center py-2" th:text="${error}"></div>

        <form th:action="@{/register}" method="post" class="d-flex flex-column gap-3">
            <input type="text" name="username" class="form-control" placeholder="Username" required>
            <input type="password" name="password" class="form-control" placeholder="Password" required>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <button type="submit" class="btn btn-update w-100 mt-2">Register</button>
        </form>

        <p class="text-center mt-3 mb-0">Already have an account?
            <a th:href="@{/login}" class="text-success fw-semibold">Log in</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
