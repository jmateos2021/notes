<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error 500 - Internal error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/note.css" rel="stylesheet">
</head>
<body>

<div class="notes-container">
    <div class="mt-4">
        <h2 th:text="${errorMessage}">An error has occurred.</h2>
        <a th:href="@{/notes}" class="btn btn-cancel">Back to Notes</a>
    </div>
</div>

</body>
</html>
