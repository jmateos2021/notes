<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>All Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/note.css}" rel="stylesheet">
</head>
<body>

<div sec:authorize="isAuthenticated()">
    Welcome, <span sec:authentication="name"></span> |
    <form th:action="@{/logout}" method="post" style="display:inline;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit">Logout</button>
    </form>
</div>

<div class="container">
    <h1 class="text-center mb-4">My Notes</h1>
    <div class="text-center mb-3">
        <a th:href="@{/notes/newNote}" class="btn btn-update btn-lg">+ New Note</a>
    </div>
    <div class="notes-container">
        <div th:each="note : ${notes}" class="note-card">
            <h5 th:text="${note.title}">Note Title</h5>
            <p class="text-truncate" th:text="${note.content}">Note content...</p>
            <span th:if="${note.completed}" class="completed-badge">Done</span>
            <div class="action-btn">
                <a th:href="@{/notes/{id}(id=${note.id})}" class="btn btn-sm btn-view">View</a>
                <a th:href="@{/notes/{id}/edit(id=${note.id})}" class="btn btn-sm btn-edit">Edit</a>
                <form th:action="@{/notes/delete/{id}(id=${note.id})}" method="post" style="display:inline">
                    <input type="hidden" name="_method" value="delete"/>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <button type="submit" class="btn btn-sm btn-delete">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
