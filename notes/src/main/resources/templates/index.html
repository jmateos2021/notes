<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/note.css" rel="stylesheet">
</head>
<body>

<div class="container">
    <h1 class="text-center mb-4">My Notes</h1>
    <div class="text-center mb-3">
        <a th:href="@{/api/notes/newNote}" class="btn btn-update btn-lg">+ New Note</a>
    </div>
    <div class="notes-container">
        <div th:each="note : ${notes}" class="note-card">
            <h5 th:text="${note.title}">Note Title</h5>
            <p class="text-truncate" th:text="${note.content}">Note content...</p>
            <span th:if="${note.completed}" class="completed-badge">Done</span>
            <div class="action-btn">
                <a th:href="@{/api/notes/{id}(id=${note.id})}" class="btn btn-sm btn-view">View</a>
                <a th:href="@{/api/notes/{id}/edit(id=${note.id})}" class="btn btn-sm btn-edit">Edit</a>
                <form th:action="@{/api/notes/delete/{id}(id=${note.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-sm btn-delete">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
